<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Duck body (simplified) -->
  <g transform="translate(256, 280)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="80" ry="90" fill="#FFD700" stroke="#FFA500" stroke-width="4"/>

    <!-- Head -->
    <circle cx="0" cy="-80" r="55" fill="#FFD700" stroke="#FFA500" stroke-width="4"/>

    <!-- Beak -->
    <ellipse cx="30" cy="-75" rx="25" ry="15" fill="#FF8C00" stroke="#FF6B00" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="-10" cy="-90" r="8" fill="#2C3E50"/>
    <circle cx="-8" cy="-92" r="3" fill="#FFFFFF"/>

    <!-- Wing -->
    <ellipse cx="-40" cy="10" rx="35" ry="50" fill="#FFC700" stroke="#FFA500" stroke-width="3" transform="rotate(-20 -40 10)"/>
  </g>

  <!-- Detective/Top Hat -->
  <g transform="translate(256, 150)">
    <!-- Hat brim -->
    <ellipse cx="0" cy="10" rx="65" ry="12" fill="#2C3E50"/>

    <!-- Hat body -->
    <rect x="-45" y="-40" width="90" height="50" rx="5" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>

    <!-- Hat band -->
    <rect x="-45" y="5" width="90" height="8" fill="#E74C3C"/>

    <!-- Hat highlight -->
    <ellipse cx="-20" cy="-20" rx="15" ry="20" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- Optional: Automation symbol (gear) -->
  <g transform="translate(400, 400)" opacity="0.8">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF"/>
    <text x="0" y="12" font-size="32" text-anchor="middle" fill="#667eea">⚙</text>
  </g>
</svg>
