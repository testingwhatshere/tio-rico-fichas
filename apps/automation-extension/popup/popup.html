<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot de Automatización</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body {
      width: 380px;
      min-height: 500px;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="p-4 space-y-4">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="../icons/icon48.png" alt="Tio Rico" style="width: 40px; height: 40px; border-radius: 10px;" />
        <div>
          <h1 class="text-white font-bold text-lg leading-tight">Tio Rico</h1>
          <p class="text-purple-300 text-xs">Bot de Automatizacion</p>
        </div>
      </div>
      <div id="status-badge" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-gray-500/30 text-gray-300 border border-gray-500/30">
        INACTIVO
      </div>
    </div>

    <!-- Connection Card -->
    <div class="glass rounded-2xl p-4">
      <div class="flex items-center gap-2 mb-3">
        <div id="connection-indicator" class="w-2 h-2 rounded-full bg-gray-500"></div>
        <span class="text-white/70 text-sm font-medium">Conexión</span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white/5 rounded-xl p-3">
          <p class="text-purple-300 text-xs mb-1">Tipo</p>
          <p id="connection-type" class="text-white font-semibold text-sm">NINGUNA</p>
        </div>
        <div class="bg-white/5 rounded-xl p-3">
          <p class="text-purple-300 text-xs mb-1">Backend</p>
          <p id="backend-url" class="text-white font-semibold text-sm truncate" title="No configurado">No configurado</p>
        </div>
      </div>
    </div>

    <!-- Current Job Card -->
    <div class="glass rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          <span class="text-white/70 text-sm font-medium">Trabajo Actual</span>
        </div>
        <span id="job-timer" class="text-purple-300 text-xs font-mono hidden">00:00</span>
      </div>

      <div id="job-info">
        <div class="text-center py-6">
          <div class="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center mx-auto mb-3">
            <svg class="w-6 h-6 text-purple-400/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
            </svg>
          </div>
          <p class="text-white/40 text-sm">Esperando trabajos...</p>
        </div>
      </div>

      <!-- Progress Steps (hidden by default) -->
      <div id="progress-steps" class="hidden mt-4 pt-4 border-t border-white/10">
        <div class="flex items-center justify-between">
          <div class="flex flex-col items-center flex-1">
            <div id="step-login" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/40 text-xs font-bold transition-all">1</div>
            <span class="text-white/40 text-xs mt-1">Login</span>
          </div>
          <div class="flex-1 h-0.5 bg-white/10 -mt-4" id="line-1"></div>
          <div class="flex flex-col items-center flex-1">
            <div id="step-search" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/40 text-xs font-bold transition-all">2</div>
            <span class="text-white/40 text-xs mt-1">Buscar</span>
          </div>
          <div class="flex-1 h-0.5 bg-white/10 -mt-4" id="line-2"></div>
          <div class="flex flex-col items-center flex-1">
            <div id="step-credit" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/40 text-xs font-bold transition-all">3</div>
            <span class="text-white/40 text-xs mt-1">Cargar</span>
          </div>
          <div class="flex-1 h-0.5 bg-white/10 -mt-4" id="line-3"></div>
          <div class="flex flex-col items-center flex-1">
            <div id="step-confirm" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/40 text-xs font-bold transition-all">4</div>
            <span class="text-white/40 text-xs mt-1">Confirmar</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts & Stats -->
    <div class="glass rounded-2xl p-4">
      <div class="flex items-center gap-2 mb-3">
        <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-white/70 text-sm font-medium">Estadísticas</span>
      </div>
      <div class="flex items-center gap-4">
        <!-- Donut Chart -->
        <div id="donut-chart" class="flex-shrink-0">
          <!-- Chart will be rendered here -->
        </div>
        <!-- Sparkline & Numbers -->
        <div class="flex-1 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-white/50 text-xs">Últimos 7 días</span>
            <div id="sparkline-chart">
              <!-- Sparkline will be rendered here -->
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div class="text-center">
              <p id="jobs-today" class="text-lg font-bold text-white">0</p>
              <p class="text-purple-300 text-xs">Hoy</p>
            </div>
            <div class="text-center">
              <p id="success-rate" class="text-lg font-bold text-emerald-400">0</p>
              <p class="text-purple-300 text-xs">Exitosos</p>
            </div>
            <div class="text-center">
              <p id="failed-today" class="text-lg font-bold text-red-400">0</p>
              <p class="text-purple-300 text-xs">Fallidos</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent Jobs -->
    <div class="glass rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="text-white/70 text-sm font-medium">Historial Reciente</span>
        </div>
      </div>
      <div id="recent-jobs" class="space-y-2 max-h-32 overflow-y-auto">
        <p class="text-white/30 text-xs text-center py-4">Sin trabajos recientes</p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button id="btn-open-panel" class="glass hover:bg-white/20 transition-all rounded-xl p-3 flex items-center justify-center gap-2 text-white font-medium text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
        Abrir Panel
      </button>
      <button id="btn-reconnect" class="glass hover:bg-white/20 transition-all rounded-xl p-3 flex items-center justify-center gap-2 text-white font-medium text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Reconectar
      </button>
    </div>

    <!-- Kill Switch -->
    <button id="btn-kill-switch" class="w-full bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 transition-all rounded-xl p-3 flex items-center justify-center gap-2 text-red-400 font-medium text-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
      </svg>
      Detener Automatización
    </button>

    <!-- Footer -->
    <div class="flex items-center justify-between pt-2">
      <button id="link-options" class="text-purple-300 hover:text-white text-xs flex items-center gap-1 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Configuración
      </button>
      <span class="text-white/20 text-xs">v1.0.0</span>
      <button id="link-logs" class="text-purple-300 hover:text-white text-xs flex items-center gap-1 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Registros
      </button>
    </div>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-4 left-4 right-4 space-y-2 z-50"></div>

  <script src="../utils/charts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
