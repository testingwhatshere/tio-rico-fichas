# ============================================
# RENDER BLUEPRINT - Backend API
# ============================================
# https://render.com/docs/blueprint-spec
#
# Deploy: Click "New" > "Blueprint" > paste repo URL
# Or use: https://render.com/deploy?repo=YOUR_REPO_URL
#
# This setup uses ONLY PostgreSQL (no Redis required)
# Job queue is managed in Postgres for simplicity

services:
  - type: web
    name: game-automation-backend
    runtime: node
    region: oregon
    plan: free # Use 'starter' for always-on (free tier spins down)
    rootDir: apps/backend-api
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate:deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: game-automation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BOT_API_KEY
        generateValue: true
      - key: QUEUE_COOLDOWN_MS
        value: "30000"
      - key: MAX_REQUEST_AMOUNT
        value: "10000"
      - key: MAX_REQUESTS_PER_HOUR
        value: "10"
      - key: AUTOMATION_ENABLED
        value: "true"
      - key: VALIDATION_THRESHOLD
        value: "0.7"
      - key: CORS_ORIGIN
        sync: false # Set to your frontend URLs after deployment

databases:
  - name: game-automation-db
    plan: free # Use 'starter' for production
    region: oregon
    postgresMajorVersion: 16
