app = "tiorico-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  QUEUE_COOLDOWN_MS = "30000"
  MAX_REQUEST_AMOUNT = "10000"
  MAX_REQUESTS_PER_USER_PER_HOUR = "10"
  VALIDATION_THRESHOLD = "0.8"
  VALIDATION_TIMEOUT_MS = "90000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

# Secrets (set via `fly secrets set`):
# DATABASE_URL, DIRECT_URL, JWT_SECRET, BOT_API_KEY,
# OPERATOR_API_KEY, VALIDATOR_API_KEY, CLOUDINARY_URL,
# CORS_ORIGIN

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
