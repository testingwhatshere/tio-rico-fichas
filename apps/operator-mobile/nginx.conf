server {
  listen 10000;
  root /usr/share/nginx/html;
  index index.html;

  # Assets con hash en el nombre: inmutables, se cachean para siempre.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Todo lo demas cae en el index.html (expo-router es una SPA: /failures,
  # /failure/<id>, etc. resuelven al mismo bundle). El index NO se cachea: es
  # el que nombra al bundle hasheado, y si el navegador se lo queda el operador
  # sigue corriendo la build anterior despues de un deploy.
  location / {
    # Sin `expires`: nginx emitiria un segundo Cache-Control y quedan dos
    # headers contradictorios, que cada proxy resuelve como quiere.
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
